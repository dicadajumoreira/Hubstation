[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# --- Site institucional da HubStation (hubstation.com.br) ---
# As páginas são estáticas em public/hubstation/; o middleware reescreve
# por host. Ver middleware.ts e lib/tenant.ts.

# Canonicaliza no apex, igual ao site anterior.
[[redirects]]
  from = "https://www.hubstation.com.br/*"
  to = "https://hubstation.com.br/:splat"
  status = 301
  force = true

# Os headers batem no path da requisição, antes do rewrite do middleware.
# Por isso as regras de cache miram /hubstation/css|js|assets — que é o que
# o navegador pede de fato (os HTML referenciam esses caminhos absolutos).
[[headers]]
  for = "/hubstation/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hubstation/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hubstation/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Headers de segurança que o site da HubStation já tinha. Valem pro site
# inteiro — nada aqui é embutido em iframe.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
